name: Daily update 0050 charts

on:
  schedule:
    - cron: '0 7 * * *'   # 15:00 Asia/Taipei
    - cron: '0 10 * * *'  # 18:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 先把 main（或你專案的預設分支）checkout 下來
      - name: Checkout code
        uses: actions/checkout@v4
        # 不指定 ref 就會抓 workflow 所在的預設分支（通常是 main）

      # 2. 設定 Python 3.11 並快取 pip 套件
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安裝相依
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas plotly

      # 4. 產生圖表
      - name: Generate charts
        run: python scripts/make_charts.py

      # 5. 用 peaceiris/actions-gh-pages 一次完成 gh-pages 部署
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
