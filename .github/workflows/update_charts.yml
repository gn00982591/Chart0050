name: Daily update 0050 charts

on:
  schedule:
    - cron: '0 7 * * *'   # 15:00 Asia/Taipei
    - cron: '0 10 * * *'  # 18:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update-0050
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Python 3.11 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas plotly

      - name: Generate charts
        run: python scripts/make_charts.py

      # 若想繼續沿用手動 git push：
      - name: Commit & push charts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 0050_*.html
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update charts $(date -u +'%Y-%m-%d')"

          git push origin gh-pages

      # 或改用 peaceiris/actions-gh-pages 自動部署：
      #- name: Deploy to GitHub Pages
