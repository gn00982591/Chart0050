
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Stock Tracker (Sheets API)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google 登入</h2>
  <div id="g_id_signin"></div>
  <h2>送出交易</h2>
  <button onclick="addTrade()">新增交易紀錄</button>
  <pre id="out"></pre>

  <script>
  const CLIENT_ID = '927019386942-13m70ac2u1ilcqm73bhv5hlclm5i5jt8.apps.googleusercontent.com'; // ⚠️填你自己的
  const SHEET_ID = 'AKfycbwjh5sh4YkX-sUUiBf1H05Ac1kAPLgGNITUnzLNh538KYKb2eVTnZvCNmiuuBorWEY98A';           // ⚠️填你自己的
  let accessToken = null;

  // 1) 初始化登入按鈕
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: async res => {
      const tokenRes = await fetch('https://oauth2.googleapis.com/tokeninfo?id_token=' + res.credential);
      const user = await tokenRes.json();
      document.getElementById("out").innerText = `登入成功：\n${user.email}`;
    }
  });
  google.accounts.id.renderButton(document.getElementById("g_id_signin"), { theme: "outline", size: "large" });

  // 2) 向 Google 拿 access_token（interactive）
  async function ensureAccessToken(){
    return new Promise(resolve => {
      google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets',
        callback: tokenResp => {
          accessToken = tokenResp.access_token;
          resolve(accessToken);
        }
      }).requestAccessToken();
    });
  }

  // 3) 寫入交易資料
  async function addTrade(){
    if (!accessToken) await ensureAccessToken();

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Trades!A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
    const trade = ["2025-04-25", "0050", "BUY", 100, 160.5, 20, "測試", new Date().toISOString()];

    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ values: [trade] })
    });

    const result = await res.json();
    document.getElementById("out").innerText = JSON.stringify(result, null, 2);
  }
  </script>
</body>
</html>
